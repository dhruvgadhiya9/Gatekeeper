spring:
  application:
    name: gatekeeper-qaplatform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gatekeeper}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
  security:
    oauth2:
      client:
        registration:
          oidc:
            provider: oidc
            client-id: ${OIDC_CLIENT_ID}
            client-secret: ${OIDC_CLIENT_SECRET}
            scope: openid,profile,email
            redirect-uri: ${PUBLIC_URL:http://localhost:5173}/login/oauth2/code/oidc
        provider:
          oidc:
            issuer-uri: ${OIDC_ISSUER_URI}

server:
  port: 8080
  # Takes the client address and scheme from X-Forwarded-* only when the request
  # comes directly from a private-network proxy.
  forward-headers-strategy: native
  tomcat:
    # Read an oversized upload to the end, so the client gets a 413 and not a dropped connection.
    max-swallow-size: 110MB
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      # The session only exists during the OIDC redirect; see SecurityConfig.
      timeout: 10m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:true}

# Only temporary failures count: a 404 or 403 isn't a sign that the other service is down.
resilience4j:
  retry:
    configs:
      external:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.HttpClientErrorException$TooManyRequests
    instances:
      github:
        base-config: external
      figma:
        base-config: external
      zoho:
        base-config: external
      # For writes that would duplicate if repeated after an unknown outcome. A 429 means Zoho
      # didn't process the request, so it's the only failure that's safe to repeat blindly.
      zoho-rate-limited:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.HttpClientErrorException$TooManyRequests
  circuitbreaker:
    configs:
      external:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.HttpClientErrorException$TooManyRequests
    instances:
      github:
        base-config: external
      figma:
        base-config: external
      zoho:
        base-config: external
      # No retry for this one: Claude Code does its own, and streaming requests can't be replayed here.
      anthropic:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        record-exceptions:
          - java.io.IOException

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs/ui

app:
  encryption:
    # Base64-encoded 256-bit key. The application refuses to start without it.
    key: ${APP_ENCRYPTION_KEY}
  storage:
    # Any S3-compatible store. Leave the endpoint empty to use AWS S3.
    endpoint: ${STORAGE_ENDPOINT:}
    # The address sandboxes use for pre-signed URLs, if it differs from the endpoint.
    sandbox-endpoint: ${STORAGE_SANDBOX_ENDPOINT:}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:gatekeeper-artifacts}
    access-key: ${STORAGE_ACCESS_KEY}
    secret-key: ${STORAGE_SECRET_KEY}
    create-bucket: ${STORAGE_CREATE_BUCKET:false}
  github:
    # Leave the App ID empty until the GitHub App exists. The wizard then falls back to typed repositories.
    app-id: ${GITHUB_APP_ID:}
    # Base64-encoded PEM private key of the GitHub App.
    private-key: ${GITHUB_APP_PRIVATE_KEY:}
    api-url: ${GITHUB_API_URL:https://api.github.com}
    web-url: ${GITHUB_WEB_URL:https://github.com}
    api-version: "2026-03-10"
  figma:
    api-url: ${FIGMA_API_URL:https://api.figma.com}
  zoho:
    # Leave empty until the Zoho OAuth client exists. The wizard then takes typed IDs.
    client-id: ${ZOHO_CLIENT_ID:}
    client-secret: ${ZOHO_CLIENT_SECRET:}
    # us, eu, in, au, jp, ca, cn, sa, uk, ae or sg
    data-center: ${ZOHO_DATA_CENTER:in}
    # Attaching files needs broad WorkDrive scopes. When false, bugs link to evidence instead.
    attachments-enabled: ${ZOHO_ATTACHMENTS_ENABLED:true}
  llm:
    # Only the backend holds this. Sandboxes reach the API through the proxy with a job token.
    api-key: ${ANTHROPIC_API_KEY:}
    base-url: ${ANTHROPIC_UPSTREAM_URL:https://api.anthropic.com}
    # The models a run may use. The first is what agents run on, the second their background helper.
    model: ${LLM_MODEL:claude-opus-5-5}
    small-model: ${LLM_SMALL_MODEL:claude-haiku-5-5}
    # US dollars per million tokens, for cost estimates. Check these against Anthropic's pricing page.
    pricing:
      "[claude-opus-5-5]": { input: 4.00, output: 20.00, cache-write: 5.00, cache-read: 0.20 }
      "[claude-sonnet-5-5]": { input: 2.00, output: 10.00, cache-write: 2.50, cache-read: 0.20 }
      "[claude-haiku-5-5]": { input: 0.10, output: 0.50, cache-write: 0.125, cache-read: 0.01 }
  sandbox:
    # When false, runs can't start. When true, the backend needs access to a Docker daemon.
    enabled: ${SANDBOX_ENABLED:false}
    # Base64-encoded key of at least 256 bits, separate from the login token key.
    job-token-secret: ${APP_JOB_TOKEN_SECRET}
    runner-image: ${SANDBOX_RUNNER_IMAGE:gatekeeper-runner:local}
    egress-proxy-image: ${SANDBOX_EGRESS_PROXY_IMAGE:gatekeeper-egress-proxy:local}
    # How a sandbox reaches this backend, through its egress proxy.
    backend-url: ${SANDBOX_BACKEND_URL:http://backend:8080}
    # The network the egress proxy uses to reach the backend, storage and the internet.
    outbound-network: ${SANDBOX_OUTBOUND_NETWORK:gatekeeper_default}
    cpus: ${SANDBOX_CPUS:2}
    memory-mb: ${SANDBOX_MEMORY_MB:6144}
    time-limit: ${SANDBOX_TIME_LIMIT:60m}
    # Input + output + cache writes + a tenth of cache reads, which roughly tracks cost.
    token-budget: ${SANDBOX_TOKEN_BUDGET:5000000}
    # Package registries and scanner data sources. The staging site, backend and storage are added per run.
    egress-allow-list: >-
      github.com,codeload.github.com,registry.npmjs.org,pypi.org,files.pythonhosted.org,
      repo.maven.apache.org,repo1.maven.org,plugins.gradle.org,plugins-artifacts.gradle.org,
      services.gradle.org,downloads.gradle.org,proxy.golang.org,sum.golang.org,api.osv.dev,semgrep.dev
  staging:
    # Comma-separated. These domains and their subdomains can never be tested.
    production-domains: ${APP_PRODUCTION_DOMAINS:}
  rate-limit:
    login-per-minute: 30
    run-start-per-minute: 10
  auth:
    public-url: ${PUBLIC_URL:http://localhost:5173}
    # Base64-encoded key of at least 256 bits. Signs login tokens.
    jwt-secret: ${APP_JWT_SECRET}
    token-ttl: 1h
    cookie-secure: ${COOKIE_SECURE:true}
    admin-emails: ${APP_ADMIN_EMAILS:}
    allowed-email-domains: ${APP_ALLOWED_EMAIL_DOMAINS:}
