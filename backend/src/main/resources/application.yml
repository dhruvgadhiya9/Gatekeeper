spring:
  application:
    name: gatekeeper-qaplatform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gatekeeper}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs/ui

app:
  encryption:
    # Base64-encoded 256-bit key. The application refuses to start without it.
    key: ${APP_ENCRYPTION_KEY}
