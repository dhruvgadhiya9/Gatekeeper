name: gatekeeper

# Local development only. Ports bind to 127.0.0.1 so nothing is exposed to the network.
services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gatekeeper}
      POSTGRES_USER: ${POSTGRES_USER:?set in infra/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in infra/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1.8-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set in infra/.env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set in infra/.env}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  minio:
    # The official minio/minio image is no longer on Docker Hub. This is Chainguard's build,
    # pinned by digest because its free tier only publishes the "latest" tag.
    image: chainguard/minio@sha256:0a01100085e30fb08d2f39e39c9f5c9d83a95707f220b007d813b690cd41622d
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in infra/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in infra/.env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Development identity provider. The backend and the browser must see the same issuer URL.
  # Browsers resolve *.localhost to this machine, and the network alias does the same for
  # containers, so keycloak.localhost:8180 works from both.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev --import-realm --http-port=8180
    environment:
      KC_HOSTNAME: http://keycloak.localhost:8180
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?set in infra/.env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in infra/.env}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?set in infra/.env}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set in infra/.env}
      PUBLIC_URL: ${PUBLIC_URL:?set in infra/.env}
      KEYCLOAK_TEST_USER_PASSWORD: ${KEYCLOAK_TEST_USER_PASSWORD:?set in infra/.env}
    ports:
      - "127.0.0.1:8180:8180"
    volumes:
      - ./keycloak/gatekeeper-realm.json:/opt/keycloak/data/import/gatekeeper-realm.json:ro
    networks:
      default:
        aliases:
          - keycloak.localhost
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30

  backend:
    build: ../backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gatekeeper}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set in infra/.env}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set in infra/.env}
      APP_JOB_TOKEN_SECRET: ${APP_JOB_TOKEN_SECRET:?set in infra/.env}
      APP_ADMIN_EMAILS: ${APP_ADMIN_EMAILS:-}
      APP_ALLOWED_EMAIL_DOMAINS: ${APP_ALLOWED_EMAIL_DOMAINS:-}
      APP_PRODUCTION_DOMAINS: ${APP_PRODUCTION_DOMAINS:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      ZOHO_CLIENT_ID: ${ZOHO_CLIENT_ID:-}
      ZOHO_CLIENT_SECRET: ${ZOHO_CLIENT_SECRET:-}
      ZOHO_DATA_CENTER: ${ZOHO_DATA_CENTER:-in}
      ZOHO_ATTACHMENTS_ENABLED: ${ZOHO_ATTACHMENTS_ENABLED:-true}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_CREATE_BUCKET: "true"
      PUBLIC_URL: ${PUBLIC_URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:?set in infra/.env}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10

  frontend:
    build: ../frontend
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  rabbitmq-data:
  minio-data:
